apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  namespace: notes-app
spec:
  replicas: 3
  selector:
    matchLabels:
      type: nginx
      app: notes-app
  template:
    metadata:
      labels:
        type: nginx
        app: notes-app
    spec:
      containers:
      - name: nginx
        image: mridul1265/django-nginx
        imagePullPolicy: Always
        ports:
        - containerPort: 80

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf 

      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config

