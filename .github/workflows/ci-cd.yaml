name: CI/CD - Docker to EC2

on:
  push:
    branches:
    - master

jobs:
  ci:
    name: Build Docker Images
    runs-on: ubuntu-latest
    environment: Docker-hub-login-credentials
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: check running containers
        run: docker compose ps

      - name: Stop application
        run: docker compose down

  push:
    name: Push Images to Docker Hub
    needs: ci
    runs-on: ubuntu-latest
    environment: Docker-hub-login-credentials
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Login to dockerhub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_PASSWORD }}

     - name: Build Docker images
       run: docker compose build
     - name: Push Docker images
       run: docker compose push

  cd:
    name: Deploy to AWS EC2
    needs: push
    runs-on: ubuntu-latest
    environment: AWS_CREDENTIALS

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Copy deployment file to EC2
       uses: appleboy/scp-action@v1
       with:
         host: ${{ secrets.EC_HOST }}
         username: ubuntu
         key: ${{ secrets.EC_SSH_KEY }}
         source: "compose.yaml"
         target: "/home/ubuntu/Docker-django-notes-app/"

     - name: Deploy application to EC2
       uses: appleboy/ssh-action@v1
       with:
         host: ${{ secrets.EC_HOST }}
         username: ubuntu
         key: ${{ secrets.EC_SSH_KEY }}

         script: |
           set -e
           export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
           cd ~/Docker-django-notes-app
           docker compose pull
           docker compose up -d
           docker image prune -f
           docker compose ps
