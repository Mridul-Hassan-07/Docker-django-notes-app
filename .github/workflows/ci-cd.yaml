name: CI/CD - Docker to EC2

on:
  push:
    branches:
    - master

jobs:
  ci:
    name: Build Docker Images
    runs-on: ubuntu-latest
    environment: Docker-hub-login-credentials
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_HOST: ${{ secrets.DB_HOST }}

      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: check running containers
        run: docker compose ps

      - name: Stop application
        run: docker compose down

      - name: Show logs if CI fails
        if: failure()
        run: docker compose logs

      - name: Stop application
        if: always()
        run: docker compose down -v

  push:
    name: Push Images to Docker Hub
    needs: ci
    runs-on: ubuntu-latest
    environment: Docker-hub-login-credentials
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Login to dockerhub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_PASSWORD }}

     - name: Build Docker images
       run: docker compose build
     - name: Push Docker images
       run: docker compose push

  cd:
    name: Deploy to AWS EC2
    needs: push
    runs-on: ubuntu-latest
    environment: AWS_CREDENTIALS

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Copy deployment file to EC2
       uses: appleboy/scp-action@v1
       with:
         host: ${{ secrets.EC_HOST }}
         username: ubuntu
         key: ${{ secrets.EC_SSH_KEY }}
         source: "compose.yaml"
         target: "/home/ubuntu/Docker-django-notes-app/"

     - name: Deploy application to EC2
       uses: appleboy/ssh-action@v1
       with:
         host: ${{ secrets.EC_HOST }}
         username: ubuntu
         key: ${{ secrets.EC_SSH_KEY }}

         script: |
           set -e
           export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
           export DB_NAME="${{ secrets.DB_NAME }}"
           export DB_USER="${{ secrets.DB_USER }}"
           export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
           export DB_PORT="${{ secrets.DB_PORT }}"
           export DB_HOST="${{ secrets.DB_HOST }}"
           export MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}"
           export MYSQL_DATABASE="${{ secrets.MYSQL_DATABASE }}"

           cd ~/Docker-django-notes-app
           docker compose pull
           docker compose up -d --remove-orphans
           docker image prune -f
           docker compose ps
